# 使用するモデル
model: deepseek-flash
api_key_env: DEEPSEEK_API_KEY

# 動画全体のボリューム設定
video:
  target_duration_min: 10      # 目標尺（分）
  narration_chars_per_min: 320 # 1分あたりの読み上げ文字数（tideの実測値で調整）
  slides_min: 8                # スライド枚数の下限
  slides_max: 25               # スライド枚数の上限
  slides_per_section: [1, 3]   # 1セクションあたりの枚数範囲

# 抽出（extract.py）の設定
extract:
  max_tokens: 4000             # JSON出力の最大トークン数
  max_retries: 2               # 失敗時のリトライ回数
  chunk_max_chars: 6000        # 1チャンクあたりの最大文字数
