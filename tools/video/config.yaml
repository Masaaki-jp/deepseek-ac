# 使用するモデル
model: deepseek-flash
api_key_env: DEEPSEEK_API_KEY

# 動画全体のボリューム設定
video:
  target_duration_min: 10      # 目標尺（分）
  narration_chars_per_min: 340 # 1分あたりの読み上げ文字数（tideの実測値で調整）
  slides_min: 8                # スライド枚数の下限
  slides_max: 25               # スライド枚数の上限
  slides_per_section: [1, 3]   # 1セクションあたりの枚数範囲

# 抽出（extract.py）の設定
extract:
  max_tokens: 12000             # JSON出力の最大トークン数
  max_retries: 2               # 空の応答・JSONとして読めない応答のときに呼び直す回数
  api_retries: 3               # 混雑（429 / 5xx）やタイムアウトのときの再試行回数
  timeout: 120                 # 1回の呼び出しのタイムアウト（秒）
  temperature: 0.3
  chunk_max_chars: 3000        # 1チャンクあたりの最大文字数
  summary_headings: [リード, 前提, まとめ, チェックリスト]   # 要約扱い（1枚まで・図なし）にする ## 見出し

# 図の描画（build_pptx.py）の設定
diagram:
  renderer: local     # local（mermaid-cli）/ ink（mermaid.ink）。local で見つからなければ ink を使う
  render_scale: 3     # ローカル描画の倍率（大きいほど高精細）
  min_font_px: 16     # 動画上で文字がこれより小さくなる図は使わない（箇条書きにする）
  max_font_px: 36     # 小さい図を拡大しすぎない上限
  min_fill_ratio: 0.25  # 図が置き場所の面積をこの割合以上使っていないと不合格（refine.py が直す）
  kinds: [flowchart, sequence, state]   # 使ってよい図の種類

# 図の改善（refine.py）の設定。不合格の図だけを DeepSeek に直させる
refine:
  max_rounds: 3        # 1枚の図につき、描いて確かめる回数の上限
  max_api_calls: 30    # 1回の実行で DeepSeek を呼ぶ回数の上限（全スライド合計）
  max_tokens: 2000
  temperature: 0.2
  timeout: 120         # 1回の呼び出しのタイムアウト（秒）
  max_retries: 3       # 混雑（429 / 5xx）やタイムアウトのときの再試行回数

# 音声合成（tts.py）の設定
tts:
  # 料金（USD / 1万文字）。サイトの料金記事の値（期間限定50%OFF）。公式の Pricing で確認して更新すること
  price_per_10k_chars: 0.225
